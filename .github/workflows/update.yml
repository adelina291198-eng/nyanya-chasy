# Задание: 3 раза в день берёт погоду (fetch.py) и сохраняет data.json в репозиторий.
# Время в GitHub — по UTC. Екатеринбург = UTC+5:
#   01:17 UTC = 06:17 Екб (утро), 07:17 UTC = 12:17 Екб (обед), 13:17 UTC = 18:17 Екб (вечер)
# Кнопка ручного запуска: вкладка Actions → «Обновить погоду» → Run workflow.
name: Обновить погоду

on:
  schedule:
    - cron: "17 1,7,13 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-data
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Собрать погоду
        run: python fetch.py

      - name: Сохранить data.json, если изменился
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data.json
          if git diff --cached --quiet; then
            echo "Изменений нет"
          else
            git commit -m "Погода обновлена автоматически"
            git pull --rebase
            git push
          fi
